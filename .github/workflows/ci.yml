name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:gas
      - run: node tools/time-test.mjs
      - run: node --test tools/deploy-gas.test.mjs
