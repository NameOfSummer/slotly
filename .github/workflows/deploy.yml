name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:gas
      - run: node tools/time-test.mjs
      - run: node --test tools/deploy-gas.test.mjs
      - name: Apps Script へ載せる
        env:
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
        run: node tools/deploy-gas.mjs
